services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ross}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ross}
      POSTGRES_DB: ${POSTGRES_DB:-ross}
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ross} -d ${POSTGRES_DB:-ross}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-ross}:${POSTGRES_PASSWORD:-ross}@db:5432/${POSTGRES_DB:-ross}
      AGENT_URL: http://agent:8000
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3001/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  agent:
    build:
      context: apps/agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      ROSS_VERSION: "0.0.0"
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
